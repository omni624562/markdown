[package]
name = "md-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
md-core = { path = "../md-core", features = ["serde"] }
wasm-bindgen = "0.2.129"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
