[workspace]
resolver = "2"
members = ["crates/md-core", "crates/md-text", "crates/md-docx", "crates/md-wasm", "crates/md-cli"]
# 桌面版需要系統的 WebView 套件，獨立成另一個 workspace，避免影響核心的建置與測試。
exclude = ["desktop"]

[workspace.package]
version = "1.56.3"
edition = "2021"
license = "MIT"

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
