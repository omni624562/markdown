[workspace]
resolver = "2"
members = ["crates/md-core", "crates/md-text", "crates/md-docx", "crates/md-wasm", "crates/md-cli"]
# 桌面版需要系統的 WebView 套件，獨立成另一個 workspace，避免影響核心的建置與測試。
exclude = ["desktop"]

[workspace.package]
version = "1.137.1"
edition = "2021"
license = "MIT"

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
# 去掉符號名稱：wasm 少四分之一（name 區段），md-cli 也一起縮小。桌面版的 profile 在 desktop/Cargo.toml 另外設定。
strip = true
