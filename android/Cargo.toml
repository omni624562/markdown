[package]
name = "md-android"
version = "1.168.0"
edition = "2021"
license = "MIT"
description = "oMarker（Markdown 編輯器）Android 版（Tauri）"

[lib]
name = "md_android"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Claude API 助理（直接編譯桌面版的 desktop/src/assistant.rs）用到的，版本和桌面版一樣。
chrono = { version = "0.4", default-features = false, features = ["clock"] }
parking_lot = "0.13"
tokio = { version = "1", features = ["time"] }
# 憑證用內建的根憑證（Android 上沒有桌面版的系統驗證方式）。
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }

[dev-dependencies]
# 共用的桌面版程式（desktop/src/io.rs）的測試用到。
tokio = { version = "1", features = ["macros", "rt", "time"] }

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
strip = true
