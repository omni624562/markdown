[package]
name = "md-android"
version = "1.151.0"
edition = "2021"
license = "MIT"
description = "oMarker（Markdown 編輯器）Android 版（Tauri）"

[lib]
name = "md_android"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
strip = true
