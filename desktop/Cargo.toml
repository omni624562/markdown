[package]
name = "md-desktop"
version = "1.46.0"
edition = "2021"
license = "MIT"
description = "oMarker（Markdown 編輯器）桌面版（Tauri）"

[[bin]]
name = "md-editor"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
md-text = { path = "../crates/md-text" }
md-docx = { path = "../crates/md-docx" }
tauri = { version = "2.12.4", features = [] }
tauri-plugin-opener = "2.7.0"
tauri-plugin-single-instance = "2.5.2"
rfd = "0.17.2"
serde = { version = "1", features = ["derive"] }
encoding_rs = "0.8"
serde_json = "1"
ignore = "0.4.33"
grep-searcher = "0.1.17"
grep-regex = "0.1.14"
grep-matcher = "0.1.9"
regex = "1.13"
notify-debouncer-full = "0.7.0"
trash = "5.2.9"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dunce = "1.0.5"
# AI 協作（第 3 批，預設關閉）
portable-pty = "0.9.0"
which = "8.0.6"
rmcp = { version = "3.5.1", default-features = false, features = ["server", "macros", "transport-streamable-http-server"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1", features = ["net", "sync", "time", "process", "io-util", "rt"] }
schemars = "1.2.3"
getrandom = "0.4.3"
# WebDAV 遠端工作區
keyring-core = "1.0.1"
quick-xml = "0.42.0"
# SSH 遠端資料夾（SFTP）。用 ring（rustls 已經在用），不多編譯一套密碼學程式庫。
russh = { version = "0.64.1", default-features = false, features = ["ring", "rsa", "flate2"] }
russh-sftp = "3.0.1"
# 自動更新
ureq = { version = "3.4.2", default-features = false, features = ["rustls", "platform-verifier", "win-system-proxy"] }
sha2 = "0.11.1"
# 驗證更新的 Ed25519 簽章（rustls 已經使用 ring，不會多編譯一套密碼學程式庫）
ring = "0.17.14"
self-replace = "1.5.0"
# 內建 Git（不需要另外安裝 Git）。不執行儲存庫設定指定的外部程式，打開來路不明的資料夾也安全。
# HTTPS 在 Windows 用系統的 WinHTTP（沿用系統憑證與 Proxy）；不支援 SSH 遠端。
git2 = { version = "0.21.0", default-features = false, features = ["https", "vendored-libgit2"] }
fontdb = { version = "0.23", default-features = false, features = ["std", "fs", "memmap"] }

# Windows 認證管理員（WebDAV 密碼）。其他平台不保存密碼，只在這次開啟期間記在記憶體裡。
[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = "1.1.0"
# 直接匯出 PDF（WebView2 的 PrintToPdf）；版本和 Tauri 使用的一致。
webview2-com = "0.39.1"
windows-core = "0.62.2"
# 自動更新在公司網路上的備援：WinHTTP 會用系統的 Proxy 自動設定與 Windows 帳號驗證。
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Networking_WinHttp"] }

# 直接匯出 PDF（WebKitGTK 的列印到檔案）；版本和 Tauri 使用的一致。
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0.2"
gtk = "0.18.2"

[features]
# 預設把前端打包進執行檔；開發時用 `cargo run --no-default-features` 改連 Vite 開發伺服器。
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
strip = true

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
