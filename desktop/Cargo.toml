[package]
name = "md-desktop"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Markdown 編輯器桌面版（Tauri）"

[[bin]]
name = "md-editor"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = ["protocol-asset"] }
tauri-plugin-opener = "2.7.0"
tauri-plugin-single-instance = "2.5.2"
rfd = "0.17.2"
serde = { version = "1", features = ["derive"] }
encoding_rs = "0.8"
serde_json = "1"
ignore = "0.4.33"
grep-searcher = "0.1.17"
grep-regex = "0.1.14"
grep-matcher = "0.1.9"
notify-debouncer-full = "0.7.0"
trash = "5.2.9"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dunce = "1.0.5"
# AI 協作（第 3 批，預設關閉）
portable-pty = "0.9.0"
which = "8.0.6"
rmcp = { version = "3.5.1", default-features = false, features = ["server", "macros", "transport-streamable-http-server"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1", features = ["net", "sync", "time", "process", "io-util", "rt"] }
schemars = "1.2.3"
getrandom = "0.4.3"
# WebDAV 遠端工作區
keyring-core = "1.0.1"
quick-xml = "0.42.0"
# 自動更新
ureq = { version = "3.4.2", default-features = false, features = ["rustls", "platform-verifier", "win-system-proxy"] }
sha2 = "0.11.1"
self-replace = "1.5.0"

# Windows 認證管理員（WebDAV 密碼）。其他平台不保存密碼，只在這次開啟期間記在記憶體裡。
[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = "1.1.0"

[features]
# 預設把前端打包進執行檔；開發時用 `cargo run --no-default-features` 改連 Vite 開發伺服器。
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
strip = true

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
