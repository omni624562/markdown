<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4c8df5"/>
      <stop offset="1" stop-color="#1f4fc2"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0b2a75" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- 底：圓角方形 -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bg)"/>
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#shine)"/>
  <!-- 文件紙（右上角摺起） -->
  <g filter="url(#shadow)">
    <path d="M150 96 H318 L382 160 V388 A28 28 0 0 1 354 416 H150 A28 28 0 0 1 122 388 V124 A28 28 0 0 1 150 96 Z" fill="#ffffff"/>
  </g>
  <path d="M318 96 V136 A24 24 0 0 0 342 160 H382 Z" fill="#c9dbfb"/>
  <!-- 標題的 # -->
  <g stroke="#2563eb" stroke-width="20" stroke-linecap="round">
    <path d="M178 152 L170 224"/>
    <path d="M214 152 L206 224"/>
    <path d="M160 174 H230"/>
    <path d="M156 204 H226"/>
  </g>
  <!-- 標題文字與內文 -->
  <rect x="248" y="178" width="84" height="22" rx="11" fill="#1e3a8a"/>
  <rect x="156" y="258" width="196" height="18" rx="9" fill="#b8c8e6"/>
  <rect x="156" y="298" width="168" height="18" rx="9" fill="#b8c8e6"/>
  <rect x="156" y="338" width="184" height="18" rx="9" fill="#b8c8e6"/>
  <!-- 鉛筆：斜放在右下角 -->
  <g transform="translate(350 356) rotate(45)" filter="url(#shadow)">
    <rect x="-20" y="-104" width="40" height="134" rx="5" fill="#f59e0b"/>
    <rect x="-20" y="-104" width="14" height="134" fill="#fbbf24"/>
    <rect x="-20" y="-130" width="40" height="30" rx="7" fill="#f87171"/>
    <rect x="-20" y="-108" width="40" height="11" fill="#e5e7eb"/>
    <path d="M-20 30 L0 76 L20 30 Z" fill="#fde7c2"/>
    <path d="M-7 60 L0 76 L7 60 Z" fill="#1f2937"/>
  </g>
</svg>