<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#282c34" media="(prefers-color-scheme: dark)" />
    <title>Markdown 編輯器</title>
    <script>
      // 在畫面繪製前套用主題，避免深色模式使用者看到白色閃爍。
      try {
        const t = localStorage.getItem("md-editor:theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch {}
    </script>
  </head>
  <body>
    <a class="skip-link" href="#editor">跳到編輯區</a>

    <header class="topbar">
      <button type="button" class="nav-toggle" data-command="toggle-outline" aria-pressed="false">
        <i data-icon="panel-left"></i>
      </button>
      <div class="topbar-side" aria-hidden="true"></div>
      <div class="tab-bar" id="tab-bar"></div>
      <div class="top-actions">
        <div class="segmented" role="radiogroup" aria-label="檢視模式">
          <button type="button" role="radio" data-view="editor"><i data-icon="code"></i><span class="label">原始碼</span></button>
          <button type="button" role="radio" data-view="live"><i data-icon="book-open-text"></i><span class="label">即時預覽</span></button>
          <button type="button" role="radio" data-view="split" class="split-only"><i data-icon="columns-2"></i><span class="label">分割</span></button>
          <button type="button" role="radio" data-view="preview"><i data-icon="eye"></i><span class="label">預覽</span></button>
        </div>
        <button type="button" id="main-menu" class="btn icon-only" title="更多功能" aria-label="更多功能"><i data-icon="ellipsis"></i></button>
      </div>
    </header>

    <main class="workspace" data-view="split">
      <nav class="activity-bar" aria-label="側邊欄">
        <div class="activity-tabs" role="tablist" aria-label="側邊欄" aria-orientation="vertical">
          <button type="button" role="tab" id="side-tab-files" data-panel="files" aria-controls="panel-files" aria-label="檔案">
            <i data-icon="files"></i>
          </button>
          <button type="button" role="tab" id="side-tab-outline" data-panel="outline" aria-controls="panel-outline" aria-label="大綱">
            <i data-icon="list-tree"></i>
          </button>
          <button type="button" role="tab" id="side-tab-search" data-panel="search" aria-controls="panel-search" aria-label="搜尋">
            <i data-icon="search"></i>
          </button>
          <button type="button" role="tab" id="side-tab-tasks" data-panel="tasks" aria-controls="panel-tasks" aria-label="待辦總覽">
            <i data-icon="list-checks"></i>
          </button>
          <button type="button" role="tab" id="side-tab-tags" data-panel="tags" aria-controls="panel-tags" aria-label="標籤">
            <i data-icon="tags"></i>
          </button>
          <button type="button" role="tab" id="side-tab-git" data-panel="git" aria-controls="panel-git" aria-label="原始碼控制（Git）" hidden>
            <i data-icon="git-branch"></i><span class="activity-badge" id="git-badge" hidden></span>
          </button>
        </div>
        <div class="activity-bottom">
          <button type="button" class="activity-btn" id="theme-menu" aria-label="主題"><span class="theme-icon"></span></button>
          <button type="button" class="activity-btn" data-command="settings"><i data-icon="settings"></i></button>
        </div>
      </nav>

      <aside class="sidebar" id="sidebar" aria-label="側邊欄內容">
        <section class="side-panel" id="panel-files" role="tabpanel" aria-labelledby="side-tab-files" hidden>
          <div class="side-head">
            <h2 id="folder-name">檔案</h2>
            <div class="side-actions" id="files-head" hidden>
              <button type="button" class="btn icon-only" id="tree-new-file" title="新增檔案" aria-label="新增檔案"><i data-icon="file-plus"></i></button>
              <button type="button" class="btn icon-only" id="tree-new-folder" title="新增資料夾" aria-label="新增資料夾"><i data-icon="folder-plus"></i></button>
              <button type="button" class="btn icon-only" id="tree-refresh" title="重新整理" aria-label="重新整理"><i data-icon="refresh-cw"></i></button>
              <button type="button" class="btn icon-only" id="files-more" title="開啟其他資料夾" aria-label="開啟其他資料夾"><i data-icon="ellipsis"></i></button>
            </div>
          </div>
          <div class="side-body">
            <div class="tree" id="file-tree" aria-label="工作區檔案"></div>
            <div class="side-empty" id="files-empty"></div>
          </div>
        </section>

        <section class="side-panel" id="panel-outline" role="tabpanel" aria-labelledby="side-tab-outline">
          <div class="side-head"><h2>大綱</h2></div>
          <div class="side-body">
            <ol id="outline-list"></ol>
            <p id="outline-empty" class="outline-empty" hidden></p>
            <section class="backlinks" id="backlinks" aria-label="反向連結" hidden></section>
          </div>
        </section>

        <section class="side-panel" id="panel-search" role="tabpanel" aria-labelledby="side-tab-search" hidden>
          <div class="side-head"><h2>搜尋</h2></div>
          <div class="side-body" id="search-host"></div>
        </section>

        <section class="side-panel" id="panel-tasks" role="tabpanel" aria-labelledby="side-tab-tasks" hidden>
          <div class="side-head">
            <h2>待辦總覽</h2>
            <div class="side-actions">
              <button type="button" class="btn icon-only" id="tasks-refresh" title="重新整理" aria-label="重新整理"><i data-icon="refresh-cw"></i></button>
            </div>
          </div>
          <div class="side-body" id="tasks-host"></div>
        </section>

        <section class="side-panel" id="panel-tags" role="tabpanel" aria-labelledby="side-tab-tags" hidden>
          <div class="side-head">
            <h2>標籤</h2>
            <div class="side-actions">
              <button type="button" class="btn icon-only" id="tags-refresh" title="重新整理" aria-label="重新整理"><i data-icon="refresh-cw"></i></button>
            </div>
          </div>
          <div class="side-body" id="tags-host"></div>
        </section>

        <section class="side-panel" id="panel-git" role="tabpanel" aria-labelledby="side-tab-git" hidden>
          <div class="side-head"><h2>原始碼控制</h2></div>
          <div class="side-body" id="git-host"></div>
        </section>
      </aside>

      <section class="pane editor-pane" aria-label="編輯區">
        <div class="format-bar" id="format-bar" role="toolbar" aria-label="格式工具列" aria-controls="editor"></div>
        <div class="review-bar" id="review-bar" role="status" hidden></div>
        <div class="ai-bar" id="ai-bar" role="status" aria-live="polite" hidden></div>
        <div class="offline-bar" id="offline-bar" role="alert" hidden></div>
        <div class="editor-host" id="editor"></div>
      </section>

      <div class="splitter" id="splitter"></div>

      <section class="pane preview-pane" id="preview-scroller" aria-label="預覽">
        <div id="parse-error" class="parse-error" role="alert" hidden></div>
        <article class="markdown-body" id="preview"></article>
        <div id="empty-state" class="empty-state" hidden></div>
      </section>
    </main>

    <section class="terminal-panel" id="terminal-panel" aria-label="終端機" hidden></section>

    <footer class="statusbar">
      <select id="doc-kind" class="status-select" aria-label="文件類型" title="文件類型">
        <option value="markdown">Markdown</option>
        <option value="text">純文字</option>
        <option value="json">JSON</option>
      </select>
      <span id="status-cursor"></span>
      <span id="status-stats"></span>
      <button type="button" id="status-save" class="status-btn save-state"></button>
      <span id="status-update" class="update-state" role="status" hidden></span>
      <button type="button" class="status-btn" data-command="toggle-terminal" hidden><i data-icon="square-terminal"></i><span>終端機</span></button>
    </footer>

    <input type="file" id="file-input" accept=".md,.markdown,.txt,.text,.log,.json,text/markdown,text/plain,application/json" hidden />
    <div class="drop-overlay" hidden>
      <div>
        <strong>放開以開啟檔案</strong>
        <span>支援 .md、.txt、.json；圖片會插入到文件中</span>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
