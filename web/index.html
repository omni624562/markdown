<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#282c34" media="(prefers-color-scheme: dark)" />
    <title>oMarker</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <!-- 在畫面繪製前套用主題，避免深色模式使用者看到白色閃爍（外部檔案：CSP 不允許行內腳本）。 -->
    <script src="theme-init.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#editor">跳到編輯區</a>

    <header class="topbar">
      <!-- 主選單（☰）在最左上角、圖示列的正上方；窄視窗時移到右上角。 -->
      <button type="button" id="main-menu" class="nav-menu" title="更多功能" aria-label="更多功能"><i data-icon="menu"></i></button>
      <!-- 側邊欄開關：窄視窗時在左上角（打開抽屜）；寬視窗時用圖示列最上面那一顆。 -->
      <button type="button" class="nav-toggle" data-command="toggle-outline" aria-pressed="false">
        <i data-icon="panel-left"></i>
      </button>
      <div class="topbar-side" aria-hidden="true"></div>
      <div class="tab-bar" id="tab-bar"></div>
      <!-- 右上角那一塊：右側欄的分頁列（app/right-tabs.ts 放進來）和收起／打開右側欄的開關；助理開著時和右側欄同寬，
           Windows 的視窗按鈕在它最右邊，永遠貼在視窗右上角。 -->
      <div class="top-actions">
        <button type="button" class="btn icon-only" data-command="toggle-outline-right" aria-pressed="true" hidden><i data-icon="panel-right-close"></i></button>
      </div>
    </header>

    <main class="workspace" data-view="split">
      <nav class="activity-bar" aria-label="側邊欄">
        <!-- 寬視窗的側邊欄開關：圖示列最上面，側邊欄開著或收起都在同一個位置；下面一條細線和面板的圖示分開。 -->
        <button type="button" class="activity-btn activity-toggle" data-command="toggle-outline" aria-pressed="false"><i data-icon="panel-left"></i></button>
        <div class="activity-sep" aria-hidden="true"></div>
        <button type="button" class="activity-project" id="activity-project" hidden><span class="project-avatar"></span></button>
        <div class="activity-tabs" role="tablist" aria-label="側邊欄" aria-orientation="vertical">
          <button type="button" role="tab" id="side-tab-files" data-panel="files" aria-controls="panel-files" aria-label="檔案">
            <i data-icon="files"></i>
          </button>
          <button type="button" role="tab" id="side-tab-outline" data-panel="outline" aria-controls="panel-outline" aria-label="大綱">
            <i data-icon="list-tree"></i>
          </button>
          <button type="button" role="tab" id="side-tab-search" data-panel="search" aria-controls="panel-search" aria-label="搜尋">
            <i data-icon="search"></i>
          </button>
          <button type="button" role="tab" id="side-tab-tasks" data-panel="tasks" aria-controls="panel-tasks" aria-label="待辦總覽">
            <i data-icon="list-checks"></i>
          </button>
          <button type="button" role="tab" id="side-tab-tags" data-panel="tags" aria-controls="panel-tags" aria-label="標籤">
            <i data-icon="tags"></i>
          </button>
          <button type="button" role="tab" id="side-tab-issues" data-panel="issues" aria-controls="panel-issues" aria-label="Issues（GitHub）" hidden>
            <i data-icon="circle-dot"></i>
          </button>
          <button type="button" role="tab" id="side-tab-workitems" data-panel="workitems" aria-controls="panel-workitems" aria-label="工作項目（Azure DevOps）" hidden>
            <i data-icon="square-kanban"></i><span class="activity-badge" id="ado-badge" hidden></span>
          </button>
          <button type="button" role="tab" id="side-tab-board" data-panel="board" aria-controls="panel-board" aria-label="工作板（Azure DevOps）" hidden>
            <i data-icon="layout-grid"></i>
          </button>
          <button type="button" role="tab" id="side-tab-wiki" data-panel="wiki" aria-controls="panel-wiki" aria-label="Wiki（Azure DevOps）" hidden>
            <i data-icon="book-open-text"></i>
          </button>
          <button type="button" role="tab" id="side-tab-git" data-panel="git" aria-controls="panel-git" aria-label="原始碼控制（Git）" hidden>
            <i data-icon="git-branch"></i><span class="activity-badge" id="git-badge" hidden></span>
          </button>
        </div>
        <div class="activity-cmds" role="toolbar" aria-label="釘選的按鈕" aria-orientation="vertical" hidden></div>
      </nav>

      <aside class="sidebar" id="sidebar" aria-label="側邊欄內容">
        <section class="side-panel" id="panel-files" role="tabpanel" aria-labelledby="side-tab-files" hidden>
          <div class="side-head">
            <h2 class="project-head">
              <button type="button" class="project-switch"><span class="project-dot" hidden></span><span id="folder-name">檔案</span><i data-icon="chevron-down"></i></button>
            </h2>
            <div class="side-actions" id="files-head" hidden>
              <button type="button" class="btn icon-only" id="tree-new-file" title="新增檔案" aria-label="新增檔案"><i data-icon="file-plus"></i></button>
              <button type="button" class="btn icon-only" id="tree-new-folder" title="新增資料夾" aria-label="新增資料夾"><i data-icon="folder-plus"></i></button>
              <button type="button" class="btn icon-only" id="tree-refresh" title="重新讀取檔案清單（不會和 Git 同步）" aria-label="重新讀取檔案清單"><i data-icon="refresh-cw"></i></button>
            </div>
          </div>
          <button type="button" class="folder-branch" id="folder-branch" hidden><i data-icon="git-branch"></i><span></span></button>
          <div class="side-body">
            <div class="tree" id="file-tree" aria-label="專案的檔案"></div>
            <div class="side-empty" id="files-empty"></div>
          </div>
        </section>

        <section class="side-panel" id="panel-outline" role="tabpanel" aria-labelledby="side-tab-outline">
          <div class="side-head"><h2>大綱</h2></div>
          <div class="side-body">
            <ol id="outline-list"></ol>
            <p id="outline-empty" class="outline-empty" hidden></p>
            <section class="backlinks" id="backlinks" aria-label="反向連結" hidden></section>
          </div>
        </section>

        <section class="side-panel" id="panel-search" role="tabpanel" aria-labelledby="side-tab-search" hidden>
          <div class="side-head"><h2>搜尋</h2></div>
          <div class="side-body" id="search-host"></div>
        </section>

        <section class="side-panel" id="panel-tasks" role="tabpanel" aria-labelledby="side-tab-tasks" hidden>
          <div class="side-head">
            <h2>待辦總覽</h2>
            <div class="side-actions">
              <button type="button" class="btn icon-only" id="tasks-refresh" title="重新整理" aria-label="重新整理"><i data-icon="refresh-cw"></i></button>
            </div>
          </div>
          <div class="side-body" id="tasks-host"></div>
        </section>

        <section class="side-panel" id="panel-tags" role="tabpanel" aria-labelledby="side-tab-tags" hidden>
          <div class="side-head">
            <h2>標籤</h2>
            <div class="side-actions">
              <button type="button" class="btn icon-only" id="tags-refresh" title="重新整理" aria-label="重新整理"><i data-icon="refresh-cw"></i></button>
            </div>
          </div>
          <div class="side-body" id="tags-host"></div>
        </section>

        <section class="side-panel" id="panel-issues" role="tabpanel" aria-labelledby="side-tab-issues" hidden>
          <div class="side-head">
            <h2>Issues</h2>
            <div class="side-actions">
              <button type="button" class="btn icon-only" id="issues-refresh" title="重新整理" aria-label="重新整理"><i data-icon="refresh-cw"></i></button>
            </div>
          </div>
          <div class="side-body" id="issues-host"></div>
        </section>

        <section class="side-panel" id="panel-workitems" role="tabpanel" aria-labelledby="side-tab-workitems" hidden>
          <div class="side-head">
            <h2>工作項目</h2>
            <div class="side-actions">
              <button type="button" class="btn icon-only" id="workitems-refresh" title="重新整理" aria-label="重新整理"><i data-icon="refresh-cw"></i></button>
            </div>
          </div>
          <div class="side-body" id="workitems-host"></div>
        </section>

        <section class="side-panel" id="panel-board" role="tabpanel" aria-labelledby="side-tab-board" hidden>
          <div class="side-head">
            <h2>工作板</h2>
            <div class="side-actions">
              <button type="button" class="btn icon-only" id="board-refresh" title="重新整理" aria-label="重新整理"><i data-icon="refresh-cw"></i></button>
            </div>
          </div>
          <div class="side-body" id="board-host"></div>
        </section>

        <section class="side-panel" id="panel-wiki" role="tabpanel" aria-labelledby="side-tab-wiki" hidden>
          <div class="side-head">
            <h2>Wiki</h2>
            <div class="side-actions">
              <button type="button" class="btn icon-only" id="wiki-dock"><i data-icon="panel-right"></i></button>
              <button type="button" class="btn icon-only" id="wiki-refresh" title="重新整理" aria-label="重新整理"><i data-icon="refresh-cw"></i></button>
            </div>
          </div>
          <div class="side-body" id="wiki-host"></div>
        </section>

        <section class="side-panel" id="panel-git" role="tabpanel" aria-labelledby="side-tab-git" hidden>
          <div class="side-head">
            <h2>原始碼控制</h2>
            <div class="side-actions" id="git-head" hidden></div>
          </div>
          <div class="side-body" id="git-host"></div>
        </section>
      </aside>

      <section class="pane editor-pane" aria-label="編輯區">
        <div class="pane-head" id="main-pane-head" hidden></div>
        <div class="format-bar" id="format-bar" role="toolbar" aria-label="格式工具列" aria-controls="editor"></div>
        <div class="review-bar" id="review-bar" role="status" hidden></div>
        <div class="ai-bar" id="ai-bar" role="status" aria-live="polite" hidden></div>
        <div class="offline-bar" id="offline-bar" role="alert" hidden></div>
        <div class="offline-bar wiki-bar" id="wiki-bar" role="status" aria-live="polite" hidden></div>
        <section class="wiki-mine" id="wiki-mine" hidden></section>
        <div class="editor-host" id="editor"></div>
      </section>

      <div class="splitter" id="splitter"></div>

      <section class="pane preview-pane" id="preview-scroller" aria-label="預覽">
        <div id="parse-error" class="parse-error" role="alert" hidden></div>
        <article class="markdown-body" id="preview"></article>
        <div id="empty-state" class="empty-state" hidden></div>
      </section>

      <!-- 並排編輯：右邊的另一份文件（放在預覽的位置）。 -->
      <section class="pane side-editor-pane" id="side-pane" aria-label="右邊的文件">
        <div class="pane-head" id="side-pane-head"></div>
        <div class="editor-host" id="editor-side"></div>
      </section>

      <!-- 右側欄：設定「大綱放在右邊」時的大綱、移到右側的 Wiki 面板會放在這裡。 -->
      <aside class="outline-right" id="outline-right" aria-label="右側欄" hidden></aside>
    </main>

    <section class="terminal-panel" id="terminal-panel" aria-label="終端機" hidden></section>

    <footer class="statusbar">
      <div class="segmented view-switch" role="radiogroup" aria-label="檢視模式">
        <button type="button" role="radio" data-view="editor"><i data-icon="code"></i><span class="label">原始碼</span></button>
        <button type="button" role="radio" data-view="live"><i data-icon="file-pen-line"></i><span class="label">即時預覽</span></button>
        <button type="button" role="radio" data-view="split" class="split-only"><i data-icon="columns-2"></i><span class="label">分割</span></button>
        <button type="button" role="radio" data-view="preview"><i data-icon="eye"></i><span class="label">預覽</span></button>
      </div>
      <!-- 檢視切換左邊的這幾項：平常直接排在狀態列上；區塊樣式「圓角區塊」時包成一整條圓條，和檢視切換並排。 -->
      <div class="status-items">
        <span id="status-view" class="status-view" hidden></span>
        <span id="status-cursor"></span>
        <button type="button" id="status-stats" class="status-btn status-stats"></button>
        <button type="button" id="doc-kind" class="status-btn status-kind" aria-label="文件類型" title="文件類型（依副檔名自動判斷，也可以在這裡切換）"></button>
        <button type="button" id="doc-encoding" class="status-btn status-kind" aria-label="編碼" title="檔案的編碼：按一下可以用其他編碼重新讀取，或換存檔時用的編碼" hidden></button>
        <button type="button" id="doc-eol" class="status-btn status-kind" aria-label="換行" title="換行的格式：Windows 是 CRLF，macOS、Linux 是 LF" hidden></button>
        <button type="button" id="status-save" class="status-btn save-state"><i data-icon="save"></i><span class="save-state-label"></span></button>
        <button type="button" id="status-ado" class="status-btn ado-state" hidden><i data-icon="square-kanban"></i><span class="ado-dot" aria-hidden="true"></span><span class="ado-state-label"></span></button>
        <span id="status-update" class="update-state" role="status" hidden></span>
        <button type="button" class="status-btn status-terminal" data-command="toggle-terminal" aria-label="終端機" hidden><i data-icon="square-terminal"></i><span>終端機</span></button>
      </div>
    </footer>

    <input type="file" id="file-input" hidden />
    <div class="drop-overlay" hidden>
      <div>
        <strong>放開以開啟檔案</strong>
        <span>支援 Markdown、文字檔、YAML、CSV、HTML、程式碼檔；圖片會插入到文件中</span>
      </div>
    </div>
    <script type="module" src="/src/boot.ts"></script>
  </body>
</html>
