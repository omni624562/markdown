# 自動檢查相依套件的更新，每週一次：
# - GitHub Actions：workflow 裡的 action 都固定在提交的 SHA（後面註明版本），有新版時一起更新 SHA 與版本註解。
# - npm（web/）與 cargo（根目錄的 crates/、desktop/）：照鎖定檔更新。小版本與修正版合成一個 PR，大版本各自一個 PR。
# 新版本發佈後先等 7 天才提出更新（cooldown）：被盜用的帳號發佈的惡意版本，通常幾天內就會被發現下架。
# 有已知漏洞的套件由 Dependabot 安全性更新另外處理，不受這個等待限制。
# Dependabot 只更新相依套件的 PR 不需要 changes/ 片段（見 scripts/version.mjs 的 appChanges）。
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # @types/node 跟著 CI 與發佈用的 Node 主版本（目前 22），換 Node 版本時再一起升。
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript 7（用 Go 重寫的編譯器）拿掉了 JavaScript 的編譯器 API（src/i18n.test.ts 用到），
      # 型別檢查也更嚴，要另外安排遷移。
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: cargo
    directories: ["/", "/desktop"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      cargo-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # 匯出 PDF（desktop/src/pdf.rs）直接用 Tauri 內建 WebView2 的介面，windows-core、webview2-com
      # 必須和 Tauri（wry）用的版本相同，不然型別對不上、編譯失敗。等 Tauri 升級時再一起手動升。
      - dependency-name: "windows-core"
        update-types: ["version-update:semver-major"]
      - dependency-name: "webview2-com"
        update-types: ["version-update:semver-major"]
