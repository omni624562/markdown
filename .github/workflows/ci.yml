name: CI

on:
  push:
    branches: [main]
  pull_request:

# 只需要讀取程式碼。第三方 action 一律不用（改用 rustup、actions/cache 等），減少供應鏈風險。
permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-
      - run: cargo fmt --all --check
      - run: cargo fmt --manifest-path desktop/Cargo.toml --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  web:
    runs-on: ubuntu-latest
    env:
      WASM_PACK: "0.15.0"
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown && rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-pack
            target
          key: wasm-${{ runner.os }}-${{ env.WASM_PACK }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: wasm-${{ runner.os }}-${{ env.WASM_PACK }}-
      - run: command -v wasm-pack || cargo install wasm-pack --version "$WASM_PACK" --locked
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      # 不執行套件的安裝腳本（esbuild 的平台執行檔由 optionalDependencies 提供，不需要）。
      - run: npm ci --ignore-scripts
      - run: npm run wasm
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # 冒煙測試：用 Playwright 開啟建置好的網頁版，確認開啟、編輯、切換檢視、即時預覽、還原分頁沒有壞掉。
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  # 版本號規範（VERSIONING.md）：版本號一致；PR 改到程式時要升版並寫好 CHANGELOG.md。
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/version.test.mjs
      - name: 檢查版本號
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            node scripts/version.mjs check "origin/${{ github.base_ref }}"
          else
            node scripts/version.mjs
          fi
