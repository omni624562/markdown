name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同一個 PR 再推送時取消還在跑的舊執行（只有最新的提交有意義）；main 的執行不取消，一個接一個跑。
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# 只需要讀取程式碼。第三方 action 一律不用（改用 rustup、actions/cache 等），減少供應鏈風險。
# 用到的官方 action 也固定在提交的 SHA（後面註明版本），由 Dependabot（.github/dependabot.yml）提醒更新。
permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-
      - run: cargo fmt --all --check
      - run: cargo fmt --manifest-path desktop/Cargo.toml --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  web:
    runs-on: ubuntu-latest
    # 平常 5 分鐘內跑完；多留的時間給很慢的套件來源（見下面的「安裝 Playwright 的瀏覽器」）。
    # 卡住時不要等到 GitHub 預設的 6 小時。
    timeout-minutes: 60
    env:
      WASM_PACK: "0.15.0"
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown && rustup default stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-pack
            target
          key: wasm-${{ runner.os }}-${{ env.WASM_PACK }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: wasm-${{ runner.os }}-${{ env.WASM_PACK }}-
      - run: command -v wasm-pack || cargo install wasm-pack --version "$WASM_PACK" --locked
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      # 不執行套件的安裝腳本（esbuild 的平台執行檔由 optionalDependencies 提供，不需要）。
      - run: npm ci --ignore-scripts
      - run: npm run wasm
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # 冒煙測試：用 Playwright 開啟建置好的網頁版，確認開啟、編輯、切換檢視、即時預覽、還原分頁沒有壞掉。
      # --with-deps 會自己執行 apt-get，參數傳不進去，所以把重試與逾時（同 remote 工作）寫進 apt 的設定檔。
      # 平常 20 秒內裝好；Ubuntu 套件來源很慢時（同 remote 工作）曾經花了將近 12 分鐘。
      # 等到 40 分鐘，慢慢下載的也能自己跑完；真的卡住時才失敗。
      - name: 安裝 Playwright 的瀏覽器
        timeout-minutes: 40
        run: |
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' | sudo tee /etc/apt/apt.conf.d/80-ci-network > /dev/null
          npx playwright install --with-deps chromium
      - run: npm run test:e2e

  # 遠端資料夾的連線測試：在這台機器上架 SSH 與 WebDAV 伺服器（只聽本機、測試用的帳號），
  # 跑平常略過的 ssh_live、dav_live、dav_live_async，不必靠人手動驗證。
  remote:
    runs-on: ubuntu-latest
    # 平常 2～5 分鐘跑完；多留的時間給很慢的套件來源（見下面的安裝步驟）和快取沒對上、要重新編譯的時候。
    # 卡住時不要等到 GitHub 預設的 6 小時。
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/target
          key: remote-${{ runner.os }}-${{ hashFiles('desktop/Cargo.lock') }}
          restore-keys: remote-${{ runner.os }}-
      # 平常 1 分鐘內裝好。偶爾會分到很慢的 Ubuntu 套件來源（每秒只有幾十 KB，一個大套件好幾分鐘沒有新的輸出，看起來像卡住），
      # 要 25～30 分鐘才下載得完，但最後會成功：等到 40 分鐘，讓它自己跑完，不必手動重新執行；真的卡住時才失敗。
      # apt 下載失敗時重試 3 次，30 秒沒有回應就算這次失敗（還在慢慢下載的不算，所以還是要靠 timeout-minutes）。
      - name: 安裝桌面版需要的套件與測試伺服器
        timeout-minutes: 40
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev libxdo-dev openssh-server
          python3 -m venv "$RUNNER_TEMP/dav"
          "$RUNNER_TEMP/dav/bin/pip" install wsgidav==4.4.0 cheroot==11.1.2
      - name: 啟動 SSH 伺服器
        run: |
          pass="$(openssl rand -hex 16)"
          echo "::add-mask::$pass"
          echo "MD_SSH_PASS=$pass" >> "$GITHUB_ENV"
          sudo useradd -m mdtest
          echo "mdtest:$pass" | sudo chpasswd
          cat > "$RUNNER_TEMP/sshd_config" <<EOF
          Port 2222
          ListenAddress 127.0.0.1
          PasswordAuthentication yes
          KbdInteractiveAuthentication no
          UsePAM yes
          Subsystem sftp internal-sftp
          EOF
          sudo mkdir -p /run/sshd
          sudo /usr/sbin/sshd -f "$RUNNER_TEMP/sshd_config"
      - name: 啟動 WebDAV 伺服器
        run: |
          pass="$(openssl rand -hex 16)"
          echo "::add-mask::$pass"
          echo "MD_DAV_PASS=$pass" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/davroot"
          cat > "$RUNNER_TEMP/wsgidav.yaml" <<EOF
          host: 127.0.0.1
          port: 8099
          provider_mapping:
            "/": "$RUNNER_TEMP/davroot"
          simple_dc:
            user_mapping:
              "*":
                "me":
                  password: "$pass"
          http_authenticator:
            accept_basic: true
            accept_digest: false
            default_to_digest: false
          EOF
          nohup "$RUNNER_TEMP/dav/bin/wsgidav" --config "$RUNNER_TEMP/wsgidav.yaml" > "$RUNNER_TEMP/wsgidav.log" 2>&1 &
          for _ in $(seq 20); do curl -s -o /dev/null http://127.0.0.1:8099/ && break; sleep 1; done
      # 只編譯原生端的測試，不需要建置前端（Tauri 只要求資料夾存在）。
      - run: mkdir -p web/dist
      - name: 連線測試
        working-directory: desktop
        env:
          MD_SSH_HOST: 127.0.0.1
          MD_SSH_PORT: "2222"
          MD_SSH_USER: mdtest
          # 跳板主機：跳回同一台，確認經由跳板連線也正常。
          MD_SSH_JUMP: mdtest@127.0.0.1:2222
          MD_DAV_TEST: http://127.0.0.1:8099/
          MD_DAV_USER: me
        run: cargo test --locked -- --ignored --test-threads 1 ssh_live dav_live

  # 版本號規範（VERSIONING.md）：版本號一致；PR 改到程式時要升版並寫好 CHANGELOG.md。
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node --test scripts/version.test.mjs scripts/sign-update.test.mjs scripts/branch-check.test.mjs scripts/prune-releases.test.mjs
      # 分支規則（CLAUDE.md）：PR 合併到 main，而且不能把其他還沒合併的分支疊進來。
      # 事件裡的值（分支名稱等）一律經由環境變數傳進指令，不直接寫進 run:，避免被當成指令執行。
      - name: 檢查分支
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/branch-check.mjs "$BASE" "$HEAD_SHA"
      - name: 檢查版本號
        env:
          BASE: ${{ github.base_ref }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            node scripts/version.mjs check "origin/$BASE"
          else
            node scripts/version.mjs
          fi
