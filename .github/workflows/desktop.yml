name: Desktop

# 編譯 Windows 免安裝執行檔（md-editor.exe）。
# 每次 PR／推送到 main 都會產生可下載的 Artifact；推送 v* 標籤時另外建立 GitHub Release。
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            desktop -> target
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 建置前端
        working-directory: web
        run: |
          npm ci
          npm run wasm
          npm run build

      - name: 測試
        working-directory: desktop
        run: cargo test --locked

      - name: 編譯執行檔
        working-directory: desktop
        run: cargo build --release --locked

      - uses: actions/upload-artifact@v4
        with:
          name: md-editor-windows-x64
          path: desktop/target/release/md-editor.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: md-editor-windows-x64
      - name: 建立 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" md-editor.exe
          --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
