name: Desktop

# 編譯 Windows 免安裝執行檔（omarker.exe）。
# - 每次 PR、每次合併到 main 都會建置並產生 Artifact（需登入 GitHub 才能下載），方便測試；合併不會升版。
# - 發佈：在 Actions → Desktop 按「Run workflow」（main），依累積的 changes/ 片段升一個版本，
#   更新公開的「最新版」Release（不用登入就能下載），程式的自動更新才會看到新版。
#   版本號的 Release（v1.2.3）也由發佈時建立；推送 v* 標籤不會觸發建置或發佈。
# - 建置流水號（run_number）會編進執行檔；「最新版」附上 version.json，讓程式自動更新。
# - 發佈用的建置不還原快取，wasm-pack、wasm-bindgen 從原始碼重新編譯，wasm-opt 固定版本並核對檢查碼；
#   簽章只在 release 環境（Settings → Environments）裡進行。
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "changes/**", "**.md"]
  pull_request:
    # 只改說明文件、更新片段的 PR 不用建置 Windows 版（CI 的 version 工作還是會檢查片段）。
    paths-ignore: ["docs/**", "changes/**", "**.md"]
  workflow_dispatch:

# 同一個 PR 再推送時取消還在跑的舊建置；main 的建置與發佈不取消（發佈的工作另外有自己的 concurrency）。
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # 發佈（手動執行這個 workflow）時，先依累積的 changes/ 片段升版、把說明寫進 CHANGELOG.md、刪掉片段，提交回 main；
  # 之後的建置與發佈都用這個提交（程式裡的版本號才對）。沒有片段時不改，用原本的提交。合併到 main 不會升版。
  # 一次只跑一個，接連合併時後面的會看到前面的提交。
  version:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-version
      cancel-in-progress: false
    outputs:
      sha: ${{ steps.release.outputs.sha }}
    steps:
      # 這個工作要把升版的提交推回 main，所以保留 checkout 的登入資訊（不加 persist-credentials: false）。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: 依片段升版
        id: release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 別人剛好也合併了（推送被拒）：拿最新的 main 重來，最多三次。
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            node scripts/version.mjs release
            if [ -z "$(git status --porcelain)" ]; then break; fi
            git add -A
            git commit -m "發佈 $(node scripts/version.mjs)" -m "依 changes/ 的片段升版並寫入 CHANGELOG.md。"
            if git push origin HEAD:main; then break; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
          done
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    # PR、推送到 main 不跑 version（被略過），照常建置。
    if: ${{ !failure() && !cancelled() }}
    runs-on: windows-latest
    # 發佈時不用快取、全部重新編譯，大約 25 分鐘；PR 更快。卡住時不要等到 GitHub 預設的 6 小時。
    timeout-minutes: 60
    env:
      WASM_PACK: "0.15.0"
      # wasm-opt（縮小 wasm）用的 binaryen：和 wasm-pack 0.15.0 自己會下載的版本相同（117）。
      # 從 npm 的 binaryen 套件安裝（同一份程式編成 WebAssembly，慢一點但結果一樣），不從 GitHub Releases 下載：
      # 2026-11-08 那裡的 Windows 檔案整個下午回 504，發佈卡住。檢查碼是 npm 上 binaryen-117.0.0.tgz 的 SHA-256
      # （`npm pack binaryen@117.0.0` 之後 `sha256sum`），和 ci.yml 的 web 工作相同。
      BINARYEN_NPM: "117.0.0"
      BINARYEN_NPM_SHA256: 5f2770ade768fef921b7bc42f415d299c3825d9b4a1569774f4b45305e32efd4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha || github.sha }}
          persist-credentials: false
      # 不用第三方 action（改用 rustup、actions/cache），減少建置流程被竄改的機會。
      - name: 安裝 Rust
        shell: bash
        run: rustup toolchain install stable --profile minimal --component clippy --target wasm32-unknown-unknown && rustup default stable
      # 快取的鍵只看相依套件：每次發版 Cargo.lock 裡自己的版本號（md-*）都會變，算進去的話每次都對不上，
      # 又要花好幾分鐘重新存一份。
      - name: 相依套件的雜湊
        id: deps
        shell: bash
        run: |
          hash=$(for f in Cargo.lock desktop/Cargo.lock; do sed '/^name = "md-/{n;d}' "$f"; done | sha256sum | cut -c1-16)
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
      # 發佈（手動執行）時不還原快取：快取的內容（編譯好的 target、解開的套件原始碼、wasm-pack.exe）
      # 不會再檢查一次，被動過手腳的話會直接進到簽章的版本裡。發佈時全部重新下載、重新編譯。
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        if: github.event_name != 'workflow_dispatch'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-pack.exe
            target
            desktop/target
          key: desktop-${{ runner.os }}-${{ env.WASM_PACK }}-${{ steps.deps.outputs.hash }}
          restore-keys: desktop-${{ runner.os }}-${{ env.WASM_PACK }}-
      - name: 安裝 wasm-pack
        if: github.event_name != 'workflow_dispatch'
        shell: bash
        run: command -v wasm-pack || cargo install wasm-pack --version "$WASM_PACK" --locked
      # 發佈時 wasm-pack 與 wasm-bindgen 都從 crates.io 重新編譯（套件有檢查碼）。wasm-bindgen 用 Cargo.lock 裡的版本，
      # wasm-pack 在 PATH 上找到版本相符的就直接用，不會再從 GitHub Releases 下載沒有核對檢查碼的執行檔。
      - name: 安裝 wasm-pack 與 wasm-bindgen（發佈）
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          cargo install wasm-pack --version "$WASM_PACK" --locked --force
          bindgen="$(sed -n '/^name = "wasm-bindgen"$/{n;s/^version = "\(.*\)"$/\1/p;}' Cargo.lock)"
          if [ -z "$bindgen" ]; then echo "::error::在 Cargo.lock 找不到 wasm-bindgen 的版本"; exit 1; fi
          cargo install wasm-bindgen-cli --version "$bindgen" --locked --force
          wasm-bindgen --version
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          # 發佈時也不用 npm 的快取（npm ci 照 package-lock.json 的檢查碼重新下載）。
          cache: ${{ github.event_name != 'workflow_dispatch' && 'npm' || '' }}
          cache-dependency-path: web/package-lock.json
      # PR 的建置也用這一份（不讓 wasm-pack 自己從 GitHub Releases 下載），每個 PR 都會驗到這一步。
      # wasm-pack 在 PATH 上找到 wasm-opt 就直接用（Windows 上是 npm 產生的 wasm-opt.cmd）。
      - name: 安裝 wasm-opt（固定版本的 binaryen，從 npm 安裝並核對檢查碼）
        shell: bash
        run: |
          dir="$(cygpath -u "$RUNNER_TEMP")/binaryen"
          mkdir -p "$dir" && cd "$dir"
          npm pack "binaryen@${BINARYEN_NPM}" --silent
          echo "${BINARYEN_NPM_SHA256}  binaryen-${BINARYEN_NPM}.tgz" | sha256sum -c -
          npm install --ignore-scripts --no-audit --no-fund --no-package-lock "./binaryen-${BINARYEN_NPM}.tgz"
          ./node_modules/.bin/wasm-opt --version
          cygpath -w "$dir/node_modules/.bin" >> "$GITHUB_PATH"
          # wasm-pack 要下載工具時會放到這裡；建置完確認它是空的。
          echo "WASM_PACK_CACHE=$RUNNER_TEMP\\wasm-pack-cache" >> "$GITHUB_ENV"

      - name: 建置前端
        working-directory: web
        run: |
          npm ci --ignore-scripts
          npm run wasm
          npm run build

      - name: 確認 wasm-pack 沒有自己下載工具
        shell: bash
        run: |
          dir="$(cygpath -u "${WASM_PACK_CACHE:?}")"
          if [ -n "$(ls -A "$dir" 2>/dev/null)" ]; then
            echo "::error::wasm-pack 自己下載了工具（應該用事先安裝好的 wasm-bindgen、wasm-opt）：$(ls "$dir")"
            exit 1
          fi

      - name: 測試
        working-directory: desktop
        run: cargo test --locked

      # CLAUDE.md 要求桌面版也要過 clippy（Windows 目標）；根目錄的 workspace 在 ci.yml 檢查，desktop/ 只有這裡。
      - name: Clippy
        working-directory: desktop
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: 建置日期
        shell: bash
        run: echo "MD_EDITOR_DATE=$(TZ=Asia/Taipei date +%Y-%m-%d)" >> "$GITHUB_ENV"

      - name: 編譯執行檔
        working-directory: desktop
        env:
          # 自動更新用：比較流水號判斷新舊。
          MD_EDITOR_BUILD: ${{ github.run_number }}
          MD_EDITOR_COMMIT: ${{ needs.version.outputs.sha || github.sha }}
          # 「用 GitHub 登入」用的 OAuth App Client ID（公開資訊）。程式內建 oMarker 的 Client ID；要換成別的 App 時在儲存庫的 Settings → Variables 設定。
          OMARKER_GITHUB_CLIENT_ID: ${{ vars.OMARKER_GITHUB_CLIENT_ID }}
        run: cargo build --release --locked

      # Cargo 套件名稱沿用 md-editor（避免動到設定與鑰匙圈等內部名稱），發佈時的檔名用 omarker.exe。
      - name: 改成發佈用的檔名
        working-directory: desktop/target/release
        run: Copy-Item md-editor.exe omarker.exe

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: omarker-windows-x64
          path: desktop/target/release/omarker.exe
          if-no-files-found: error

      # 只在推送到 main、相依套件變了（快取沒對上）時才存：PR 的快取別的分支用不到，存一次要好幾分鐘。
      # 發佈時沒有還原快取（cache-hit 是空的），也不在發佈時花時間存。
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.ref == 'refs/heads/main' && github.event_name != 'workflow_dispatch' && steps.cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-pack.exe
            target
            desktop/target
          key: desktop-${{ runner.os }}-${{ env.WASM_PACK }}-${{ steps.deps.outputs.hash }}

  # 公開的「最新版」：標籤 latest 指向最新一次發佈（手動執行這個 workflow）的版本。
  # 固定下載連結：https://github.com/<owner>/<repo>/releases/download/latest/omarker.exe
  # （改名前的 md-editor.exe 不再提供；程式的自動更新看 version.json 裡的網址，本來就是 omarker.exe。）
  latest:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    needs: [version, windows]
    runs-on: ubuntu-latest
    # 簽章私鑰（新金鑰 UPDATE_SIGNING_KEY_2；換金鑰的過渡期間還有舊金鑰 UPDATE_SIGNING_KEY）放在 release 環境：只有這個工作拿得到，
    # 環境可以限定只有 main 能用、要有人核准才開始（Settings → Environments → release）。
    environment: release
    permissions:
      contents: write
    concurrency:
      group: publish-latest
      cancel-in-progress: false
    env:
      # 發佈的是升版後的提交（不是觸發這次執行的合併提交）。
      RELEASE_SHA: ${{ needs.version.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: omarker-windows-x64
      - name: 產生更新資訊（version.json）
        env:
          BUILD: ${{ github.run_number }}
          # 合併 PR 時，提交訊息第三行是 PR 標題；直接推送時用第一行。
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          version="$(node scripts/version.mjs)"
          # 更新提示的說明：CHANGELOG.md 中這一版的摘要；沒有寫時用 PR 標題或提交訊息。
          notes="$(node scripts/version.mjs summary "$version")"
          if [ -z "$notes" ]; then
            if [[ "$MESSAGE" == "Merge pull request"* ]]; then
              notes="$(printf '%s\n' "$MESSAGE" | sed -n '3p')"
            else
              notes="$(printf '%s\n' "$MESSAGE" | head -1)"
            fi
          fi
          jq -n \
            --argjson build "$BUILD" \
            --arg version "$version" \
            --arg commit "$RELEASE_SHA" \
            --arg date "$(TZ=Asia/Taipei date +%Y-%m-%d)" \
            --arg notes "$notes" \
            --arg changes "$(node scripts/version.mjs notes "$version" || true)" \
            --arg url "https://github.com/$GITHUB_REPOSITORY/releases/download/latest/omarker.exe" \
            --arg sha256 "$(sha256sum omarker.exe | cut -d' ' -f1)" \
            --argjson size "$(stat -c%s omarker.exe)" \
            '{build: $build, version: $version, commit: $commit, date: $date, notes: $notes, changes: $changes, url: $url, sha256: $sha256, size: $size}' \
            > version.json
      # 版本號 Release（v<版本號>）也附一份更新資訊，網址指向它自己的 omarker.exe（不會被之後的建置覆蓋），
      # 之後可以用「設為穩定版」（stable.yml）把這一版直接放到穩定版。
      - name: 產生這個版本號自己的更新資訊
        run: |
          version="$(node scripts/version.mjs)"
          mkdir -p tagged
          jq --arg url "https://github.com/$GITHUB_REPOSITORY/releases/download/v${version}/omarker.exe" '.url = $url' \
            version.json > tagged/version.json
      # 新金鑰一定要有，而且要和程式內建的公鑰是一對（對不上時這一步失敗，不會發佈）；
      # 舊金鑰還在時另外簽一次，讓還沒換金鑰的舊版本照常更新上來（見 scripts/sign-update.mjs）。
      - name: 簽章（程式只接受用正式私鑰簽過的更新）
        env:
          UPDATE_SIGNING_KEY_2: ${{ secrets.UPDATE_SIGNING_KEY_2 }}
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          node scripts/sign-update.mjs version.json
          node scripts/sign-update.mjs tagged/version.json
          cat version.json
      # 內建的 GITHUB_TOKEN 只能在 main 最新的提交上建立標籤：等核准的期間 main 又合併了東西，
      # 建立 Release 會被拒絕（HTTP 403 Resource not accessible by integration）。在動到任何 Release 之前就停下來，
      # 免得舊的「最新版」已經刪掉、新的卻建不起來。這時重新執行一次 Desktop（main）就好。
      - name: 確認 main 還停在要發佈的提交
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          if [ "$head" != "$RELEASE_SHA" ]; then
            echo "::error::等核准的期間 main 有新的提交（${head::7}），這次要發佈的是比較舊的 ${RELEASE_SHA::7}，GitHub 不讓這個工作替它建立標籤。沒有發佈任何東西，請重新執行一次 Desktop（main）。"
            exit 1
          fi
      - name: 更新「最新版」Release，並保留這個版本號的 Release
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD: ${{ github.run_number }}
        run: |
          version="$(node scripts/version.mjs)"
          changes="$(node scripts/version.mjs notes "$version" || true)"
          short="${RELEASE_SHA::7}"
          today="$(TZ=Asia/Taipei date +%Y-%m-%d)"
          howto="下載 omarker.exe 後直接執行即可，不需要安裝。
          第一次執行時若出現「Windows 已保護您的電腦」，請點「其他資訊」→「仍要執行」（這個執行檔沒有數位簽章）。
          之後有新版時，程式會自動提示更新。"
          # 這個版本號第一次發佈：另外建立 v<版本號> 的 Release 保留下來（之後同版本號的建置不再覆蓋）。
          if ! gh release view "v${version}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "v${version}" omarker.exe tagged/version.json --repo "$GITHUB_REPOSITORY" \
              --target "$RELEASE_SHA" --title "v${version}（${today}）" --latest=false \
              --notes "${changes}

          ${howto}"
          fi
          notes="版本 ${version}（main 分支 ${short}，第 ${BUILD} 版，${today}）

          ${changes}

          ${howto}"
          gh release delete latest --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create latest omarker.exe version.json --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_SHA" --title "最新版 v${version}（${today}）" --notes "$notes" --latest
      # 版本號的 Release 與標籤只保留最近 3 個（最新版、穩定版與穩定版指向的那一版一定保留，見 scripts/prune-releases.mjs）。
      # 清理失敗不影響這次發佈；也可以在 Actions →「清理舊版本」手動執行。
      - name: 清理舊版本（只保留最近 3 個）
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/prune-releases.mjs --keep 3
