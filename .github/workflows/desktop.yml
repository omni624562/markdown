name: Desktop

# 編譯 Windows 免安裝執行檔（omarker.exe）。
# - 每次 PR 都會產生 Artifact（需登入 GitHub 才能下載），方便測試。
# - 合併到 main 時，更新公開的「最新版」Release：不用登入就能下載。
# - 推送 v* 標籤時，另外建立該版本的 Release。
# - 建置流水號（run_number）會編進執行檔；「最新版」附上 version.json，讓程式自動更新。
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    env:
      WASM_PACK: "0.15.0"
    steps:
      - uses: actions/checkout@v4
      # 不用第三方 action（改用 rustup、actions/cache），減少建置流程被竄改的機會。
      - name: 安裝 Rust
        shell: bash
        run: rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown && rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-pack.exe
            target
            desktop/target
          key: desktop-${{ runner.os }}-${{ env.WASM_PACK }}-${{ hashFiles('Cargo.lock', 'desktop/Cargo.lock') }}
          restore-keys: desktop-${{ runner.os }}-${{ env.WASM_PACK }}-
      - name: 安裝 wasm-pack
        shell: bash
        run: command -v wasm-pack || cargo install wasm-pack --version "$WASM_PACK" --locked
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 建置前端
        working-directory: web
        run: |
          npm ci --ignore-scripts
          npm run wasm
          npm run build

      - name: 測試
        working-directory: desktop
        run: cargo test --locked

      - name: 建置日期
        shell: bash
        run: echo "MD_EDITOR_DATE=$(TZ=Asia/Taipei date +%Y-%m-%d)" >> "$GITHUB_ENV"

      - name: 編譯執行檔
        working-directory: desktop
        env:
          # 自動更新用：比較流水號判斷新舊。
          MD_EDITOR_BUILD: ${{ github.run_number }}
          MD_EDITOR_COMMIT: ${{ github.sha }}
          # 「用 GitHub 登入」用的 OAuth App Client ID（公開資訊）。程式內建 oMarker 的 Client ID；要換成別的 App 時在儲存庫的 Settings → Variables 設定。
          OMARKER_GITHUB_CLIENT_ID: ${{ vars.OMARKER_GITHUB_CLIENT_ID }}
        run: cargo build --release --locked

      # Cargo 套件名稱沿用 md-editor（避免動到設定與鑰匙圈等內部名稱），發佈時的檔名用 omarker.exe。
      - name: 改成發佈用的檔名
        working-directory: desktop/target/release
        run: Copy-Item md-editor.exe omarker.exe

      - uses: actions/upload-artifact@v4
        with:
          name: omarker-windows-x64
          path: desktop/target/release/omarker.exe
          if-no-files-found: error

  # 公開的「最新版」：標籤 latest 永遠指向 main 最新一次成功建置的版本。
  # 固定下載連結：https://github.com/<owner>/<repo>/releases/download/latest/omarker.exe
  # 舊的連結（latest/md-editor.exe）也繼續提供同一個檔案，已經分享出去的連結不會失效。
  latest:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-latest
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: omarker-windows-x64
      - name: 產生更新資訊（version.json）
        env:
          BUILD: ${{ github.run_number }}
          # 合併 PR 時，提交訊息第三行是 PR 標題；直接推送時用第一行。
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          version="$(node scripts/version.mjs)"
          # 更新提示的說明：CHANGELOG.md 中這一版的摘要；沒有寫時用 PR 標題或提交訊息。
          notes="$(node scripts/version.mjs summary "$version")"
          if [ -z "$notes" ]; then
            if [[ "$MESSAGE" == "Merge pull request"* ]]; then
              notes="$(printf '%s\n' "$MESSAGE" | sed -n '3p')"
            else
              notes="$(printf '%s\n' "$MESSAGE" | head -1)"
            fi
          fi
          jq -n \
            --argjson build "$BUILD" \
            --arg version "$version" \
            --arg commit "$GITHUB_SHA" \
            --arg date "$(TZ=Asia/Taipei date +%Y-%m-%d)" \
            --arg notes "$notes" \
            --arg changes "$(node scripts/version.mjs notes "$version" || true)" \
            --arg url "https://github.com/$GITHUB_REPOSITORY/releases/download/latest/omarker.exe" \
            --arg sha256 "$(sha256sum omarker.exe | cut -d' ' -f1)" \
            --argjson size "$(stat -c%s omarker.exe)" \
            '{build: $build, version: $version, commit: $commit, date: $date, notes: $notes, changes: $changes, url: $url, sha256: $sha256, size: $size}' \
            > version.json
      - name: 簽章（程式只接受用正式私鑰簽過的更新）
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          node scripts/sign-update.mjs version.json
          cat version.json
      - name: 更新「最新版」Release，並保留這個版本號的 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node scripts/version.mjs)"
          changes="$(node scripts/version.mjs notes "$version" || true)"
          short="${GITHUB_SHA::7}"
          today="$(TZ=Asia/Taipei date +%Y-%m-%d)"
          howto="下載 omarker.exe 後直接執行即可，不需要安裝。
          第一次執行時若出現「Windows 已保護您的電腦」，請點「其他資訊」→「仍要執行」（這個執行檔沒有數位簽章）。
          之後有新版時，程式會自動提示更新。"
          # 這個版本號第一次發佈：另外建立 v<版本號> 的 Release 保留下來（之後同版本號的建置不再覆蓋）。
          if ! gh release view "v${version}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "v${version}" omarker.exe --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "v${version}（${today}）" --latest=false \
              --notes "${changes}

          ${howto}"
          fi
          notes="版本 ${version}（main 分支 ${short}，第 ${{ github.run_number }} 版，${today}）

          ${changes}

          ${howto}"
          gh release delete latest --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          cp omarker.exe md-editor.exe
          gh release create latest omarker.exe md-editor.exe version.json --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "最新版 v${version}（${today}）" --notes "$notes" --latest

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: omarker-windows-x64
      - name: 建立 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" omarker.exe
          --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
